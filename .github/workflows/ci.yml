name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Stub secrets so config doesn't crash on import; tests use mocks/rules fallback
      GOOGLE_API_KEY: "test-key-ci"
      DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
      TESTING: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff numpy "python-jose[cryptography]" "redis[hiredis]"

      - name: Lint (ruff)
        run: ruff check app/ --select=E,F,W --ignore=E501

      - name: Repository hygiene gate
        run: python scripts/repo_hygiene_check.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run evals (rules-only, no API key needed)
        run: python -m evals.run_evals

      - name: Run P0 release gates (trajectory, RAG, safety, judge)
        env:
          EVAL_LLM_JUDGE: "0"
        run: python -m evals.run_p0_evals

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enterprise-ticket-agent-backend ./backend

  postgres-migrations:
    name: PostgreSQL Migration & RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticketdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ticketdb
      POSTGRES_RLS_TEST_URL: postgresql+asyncpg://agent_app:agent_app@localhost:5432/ticketdb
      ENVIRONMENT: testing
      GOOGLE_API_KEY: test-key-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Fresh upgrade and schema drift check
        run: |
          alembic upgrade head
          alembic check

      - name: Rollback and re-upgrade
        run: |
          alembic downgrade a902ebde4f49
          alembic upgrade head

      - name: Create least-privilege application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ticketdb -c "CREATE ROLE agent_app LOGIN PASSWORD 'agent_app' NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -d ticketdb -c "GRANT CONNECT ON DATABASE ticketdb TO agent_app; GRANT USAGE ON SCHEMA public TO agent_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO agent_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO agent_app;"

      - name: Verify row-level tenant isolation
        run: pytest tests/test_postgres_rls.py -q
