name: Data Platform Performance & DR Drill

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Number of benchmark orders
        required: true
        default: "1000000"

jobs:
  postgres-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticketdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ticketdb
      ENVIRONMENT: testing
      GOOGLE_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Create next archive partition
        run: python scripts/manage_partitions.py --year 2026 --month 7
      - name: Load and benchmark indexed queries
        run: python scripts/performance_benchmark.py --rows "${{ inputs.rows }}" --confirm-write
      - name: Create isolated DR target
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres ticketdb_dr
      - name: Backup, restore, and verify RTO/data counts
        run: >-
          python scripts/backup_restore.py drill
          --target-url postgresql+asyncpg://postgres:postgres@localhost:5432/ticketdb_dr
          --confirm-target ticketdb_dr
          --output-dir ./artifacts/dr
          --rto-seconds 900
      - uses: actions/upload-artifact@v4
        with:
          name: data-platform-drill
          path: backend/artifacts/dr
